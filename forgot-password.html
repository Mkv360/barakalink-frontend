<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Forgot Password — BarakaLink</title>

  <meta
    name="description"
    content="Recover your BarakaLink account securely using Telegram."
  >

  <meta
    name="robots"
    content="noindex, nofollow, noarchive"
  >

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >
</head>

<body>

  <main class="password-recovery-page">

    <section class="password-recovery-card">

      <div class="auth-header">

        <div>

          <h1>
            Forgot Password?
          </h1>

          <p class="auth-subtitle">
            Recover your BarakaLink account securely with Telegram.
          </p>

        </div>

      </div>


      <!-- ===============================================
           STEP 1: PHONE
      ================================================ -->

      <section
        id="forgotStepPhone"
        class="recovery-step active"
      >

        <form
          id="forgotPasswordForm"
          class="auth-form"
          novalidate
        >

          <div class="auth-field">

            <label for="forgotPhone">
              Phone Number
            </label>

            <div class="phone-group">

              <span class="phone-code">
                +251
              </span>

              <input
                class="auth-input"
                id="forgotPhone"
                type="tel"
                inputmode="tel"
                autocomplete="tel"
                placeholder="912 345 678"
              >

            </div>

            <span
              class="form-error"
              id="forgotPhoneError"
            ></span>

          </div>


          <p
            class="form-status"
            id="forgotStatus"
            role="status"
            aria-live="polite"
          ></p>


          <button
            type="submit"
            class="btn btn-primary btn-block"
            id="forgotContinueButton"
          >

            Continue with Telegram

            <i class="fa-brands fa-telegram"></i>

          </button>

        </form>

      </section>


      <!-- ===============================================
           STEP 2: TELEGRAM
      ================================================ -->

      <section
        id="forgotStepTelegram"
        class="recovery-step"
        style="display:none;"
      >

        <div class="otp-center">

          <div class="otp-icon telegram-auth-icon">

            <i class="fa-brands fa-telegram"></i>

          </div>

          <h2>
            Verify with Telegram
          </h2>

          <p>
            Connect the Telegram account associated
            with your BarakaLink phone number.
          </p>


          <button
            type="button"
            class="btn btn-primary btn-block"
            id="forgotTelegramButton"
          >

            <i class="fa-brands fa-telegram"></i>

            Continue with Telegram

          </button>


          <p
            class="form-error"
            id="forgotTelegramError"
            role="alert"
            aria-live="polite"
          ></p>

        </div>

      </section>


      <div class="auth-switch">

        <span>
          Remember your password?
        </span>

        <a href="index.html">
          Return to Login
        </a>

      </div>

    </section>

  </main>

  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>

</body>
</html>
