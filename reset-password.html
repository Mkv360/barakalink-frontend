<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Reset Password — BarakaLink</title>

  <meta
    name="description"
    content="Create a new BarakaLink password."
  >

  <meta
    name="robots"
    content="noindex, nofollow, noarchive"
  >

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >
</head>

<body>

  <main class="password-recovery-page">

    <section class="password-recovery-card">

      <div class="auth-header">

        <div>

          <h1>
            Create a New Password
          </h1>

          <p class="auth-subtitle">
            Choose a new password for your BarakaLink account.
          </p>

        </div>

      </div>


      <form
        id="resetPasswordForm"
        class="auth-form"
        novalidate
      >


        <!-- PASSWORD -->

        <div class="auth-field">

          <label for="newPassword">
            New Password
          </label>

          <div class="password-wrapper">

            <input
              class="auth-input"
              id="newPassword"
              type="password"
              autocomplete="new-password"
              placeholder="Create a new password"
            >

            <button
              type="button"
              class="password-toggle"
              data-password="newPassword"
              aria-label="Show password"
            >

              <i class="fa-solid fa-eye"></i>

            </button>

          </div>

          <span
            class="form-error"
            id="newPasswordError"
          ></span>

        </div>


        <!-- CONFIRM -->

        <div class="auth-field">

          <label for="confirmNewPassword">
            Confirm Password
          </label>

          <div class="password-wrapper">

            <input
              class="auth-input"
              id="confirmNewPassword"
              type="password"
              autocomplete="new-password"
              placeholder="Confirm your new password"
            >

            <button
              type="button"
              class="password-toggle"
              data-password="confirmNewPassword"
              aria-label="Show password"
            >

              <i class="fa-solid fa-eye"></i>

            </button>

          </div>

          <span
            class="form-error"
            id="confirmNewPasswordError"
          ></span>

        </div>


        <p
          id="resetStatus"
          class="form-status"
          role="status"
          aria-live="polite"
        ></p>


        <button
          type="submit"
          class="btn btn-primary btn-block"
          id="resetPasswordButton"
        >

          Reset Password

          <i class="fa-solid fa-lock"></i>

        </button>

      </form>


      <div
        class="auth-switch"
        id="resetFooter"
      >

        <span>
          Remember your password?
        </span>

        <a href="index.html">
          Return to Login
        </a>

      </div>

    </section>

  </main>

  <script src="js/api.js"></script>
  <script src="js/reset-password.js"></script>

</body>
</html>
