<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Verifying Telegram — BarakaLink</title>

  <meta
    name="description"
    content="Completing your secure BarakaLink verification."
  >

  <meta
    name="robots"
    content="noindex, nofollow, noarchive"
  >

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  >
</head>

<body>

  <main class="auth-callback-page">

    <section
      class="auth-callback-card"
      aria-live="polite"
    >

      <div class="otp-icon telegram-auth-icon">
        <i class="fa-brands fa-telegram"></i>
      </div>

      <h1 id="callbackTitle">
        Verifying your Telegram
      </h1>

      <p id="callbackMessage">
        Please wait while we securely complete your verification.
      </p>

      <div
        id="callbackSpinner"
        aria-hidden="true"
      >
        <i class="fa-solid fa-spinner fa-spin"></i>
      </div>

      <p
        id="callbackError"
        class="form-error"
        role="alert"
        aria-live="assertive"
      ></p>

      <button
        type="button"
        id="callbackRetry"
        class="btn btn-primary"
        style="display:none;"
      >
        Return to BarakaLink
        <i class="fa-solid fa-arrow-right"></i>
      </button>

    </section>

  </main>

  <script src="js/api.js"></script>
  <script src="js/auth-callback.js"></script>

</body>
</html>
